<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaves - Controle de Entrada/Saída</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-SgOJa3DmI69IUzQ2PVdRZhwQ+dy64/BUtbMJw1MZ8t5HZApcHrRKUc4W0kG879m7" crossorigin="anonymous">
</head>
<link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1 class="text-center text-start ps-5 pt-4">Controle de Chaves</h1>
    <div class="container d-flex justify-content-center align-items-center">
        <form id="form" class="align-items-start">
            <div class="mb-3">
                <label for="exampleFormControlInput1" class="form-label">Nome</label>
                <input type="text" class="form-control" id="name" style="width: 650px;" required>
            </div>
            <div class="mb-3">
                <label for="exampleFormControlInput1" class="form-label">Telefone</label>
                <input type="text" class="form-control" id="phone" style="width: 650px;" required>
            </div>
            <div class="mb-3">
                <label for="exampleFormControlInput1" class="form-label">Empresa</label>
                <input type="text" class="form-control" id="company" style="width: 650px;" required>
            </div>
            <div class="mb-3">
                <label for="exampleFormControlInput1" class="form-label">Código da Empresa</label>
                <input type="text" class="form-control" id="key" style="width: 650px;" required>
            </div> 
            <button type="submit" class="btn btn-outline-dark">Registrar</button>
        </form>
        <div id="response"></div>
    </div>
    <script src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
        crossorigin="anonymous"></script>
</body>

</html>
